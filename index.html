<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Welcome to My Website</h1>
    </header>
    <main>
        <p>This site is successfully hosted for free on GitHub Pages!</p>
        <button id="alertBtn">Click Me</button>
    </main>
    <script>
        // Simple interactive JavaScript
        document.getElementById('alertBtn').addEventListener('click', () => {
            alert('Hello! Your JavaScript works perfectly on GitHub Pages.');
        });
    </script>
</body>
</html>
